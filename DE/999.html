<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>學生介面（全變數 console.log 版）</title>

  <!-- Bootstrap CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- WebGazer CDN -->
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; }

    .Calibration {
      width: 30px;
      height: 30px;
      background-color: red;
      border-radius: 50%;
      border: 2px solid black;
      position: absolute;
      opacity: 0.7;
      cursor: pointer;
      z-index: 9999;
    }

    #videoWrapper {
      display: none;
      margin-top: 40px;
      position: relative;
    }

    #eyeDot {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10001;
    }

    #Accuracy {
      margin: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2 id="Accuracy">尚未校正</h2>

<div id="calibrationContainer"></div>

<div id="videoWrapper">
  <video id="video" width="640" controls src="videos/test.mp4"></video>
  <div id="eyeDot"></div>
</div>

<script>
/* ------------------------------
   9 點校正 UI 建立
------------------------------- */
const container = document.getElementById("calibrationContainer");
let clickCount = Array(9).fill(0);
const clicksNeeded = 5;

function createPoints() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  console.log("=== createPoints() start ===");
  console.log("視窗寬度 w =", w);
  console.log("視窗高度 h =", h);

  const pos = [
    [0.1,0.1],[0.5,0.1],[0.9,0.1],
    [0.1,0.5],[0.5,0.5],[0.9,0.5],
    [0.1,0.9],[0.5,0.9],[0.9,0.9]
  ];

  console.log("校正點比例 pos =", pos);

  pos.forEach((p, i) => {
    const left = w * p[0] - 15;
    const top  = h * p[1] - 15;

    console.log(`校正點 ${i+1} 計算後座標: left=${left}, top=${top}`);

    const btn = document.createElement("button");
    btn.className = "Calibration";
    btn.style.left = left + "px";
    btn.style.top  = top  + "px";

    btn.onclick = () => handleCalibration(i, btn);
    container.appendChild(btn);
  });

  console.log("=== createPoints() end ===");
}

function handleCalibration(i, element) {
  clickCount[i]++;

  const cx = element.offsetLeft + 15;
  const cy = element.offsetTop  + 15;

  console.log("=== 點擊校正點 ===");
  console.log("點擊第", i+1, "個校正點");
  console.log("clickCount =", clickCount);
  console.log("此校正點中心座標 =", {cx, cy});

  webgazer.recordScreenPosition(cx, cy, "click");

  if (clickCount[i] >= clicksNeeded) {
    element.style.background = "green";
    console.log(`校正點 ${i+1} 已完成（變綠）`);
  }

  if (clickCount.every(c => c >= clicksNeeded)) {
    document.getElementById("Accuracy").innerText = "校正完成！";

    console.log("=== 所有校正完成 === clickCount =", clickCount);

    Swal.fire("校正完成", "影片將自動開始播放", "success");

    hideCalibrationPoints();

    setTimeout(startVideoAutomatically, 800);
  }
}

function hideCalibrationPoints() {
  console.log("隱藏所有校正點");
  document.querySelectorAll(".Calibration").forEach(b => b.style.display = "none");
}

/* ------------------------------
   啟動 WebGazer
------------------------------- */
let trackingEnabled = false;
let focusRegion = null;

window.onload = function() {
  console.log("=== window.onload ===");

  createPoints();

  webgazer.setRegression('ridge')
    .showVideo(true)
    .showPredictionPoints(false)
    .showFaceOverlay(false)
    .showFaceFeedbackBox(true)
    .begin()
    .then(() => console.log("WebGazer 已啟動"))
    .catch(err => console.error("WebGazer 啟動失敗", err));

  initEyeTracking();
};

/* ------------------------------
   校正完成 → 自動播放
------------------------------- */
function startVideoAutomatically() {
  const wrapper = document.getElementById("videoWrapper");
  const video = document.getElementById("video");

  console.log("=== startVideoAutomatically ===");

  wrapper.style.display = "block";

  const rect = video.getBoundingClientRect();
  focusRegion = {
    x: rect.left,
    y: rect.top,
    width: rect.width,
    height: rect.height
  };

  console.log("focusRegion =", focusRegion);

  trackingEnabled = true;
  console.log("trackingEnabled =", trackingEnabled);

  video.play();
  console.log("影片開始播放");
}

/* ------------------------------
   眼追（含所有變數 log）
------------------------------- */
function initEyeTracking() {
  const eyeDot = document.getElementById("eyeDot");
  let history = [];
  const MAX_HISTORY = 5;
  let sx = 0, sy = 0;
  const alpha = 0.2;

  console.log("=== initEyeTracking() ===");
  console.log("MAX_HISTORY =", MAX_HISTORY);
  console.log("alpha =", alpha);

  webgazer.setGazeListener(data => {
    if (!data) return;

    console.log("----- 新一筆 gazeListener 呼叫 -----");
    console.log("原始 data =", data);

    history.push({x: data.x, y: data.y});
    if (history.length > MAX_HISTORY) history.shift();

    const avgX = history.reduce((s,p)=>s+p.x,0) / history.length;
    const avgY = history.reduce((s,p)=>s+p.y,0) / history.length;

    console.log("history =", history);
    console.log("avgX =", avgX, "avgY =", avgY);

    sx = alpha * avgX + (1 - alpha) * sx;
    sy = alpha * avgY + (1 - alpha) * sy;

    console.log("平滑後 sx =", sx);
    console.log("平滑後 sy =", sy);

    eyeDot.style.left = (sx - 5) + "px";
    eyeDot.style.top  = (sy - 5) + "px";

    if (!trackingEnabled || !focusRegion) {
      console.log("trackingEnabled =", trackingEnabled);
      console.log("focusRegion =", focusRegion);
      return;
    }

    const { x, y, width, height } = focusRegion;

    const inside =
      sx >= x && sx <= x + width &&
      sy >= y && sy <= y + height;

    console.log("inside =", inside);

    const video = document.getElementById("video");

    if (!inside && !video.paused) {
      console.log("➡ 視線離開 → 暫停影片");
      video.pause();
    }
    else if (inside && video.paused) {
      console.log("➡ 視線回到 → 播放影片");
      video.play();
    }
  });
}
</script>

</body>
</html>
